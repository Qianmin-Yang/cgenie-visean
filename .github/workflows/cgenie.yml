name: build-cgenie

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: 1. 安装 gfortran + netCDF-Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran libnetcdff-dev make git
          gfortran --version | head -1
          nf-config --version

      - name: 2. 克隆 cGENIE
        run: |
          git clone --depth 1 https://github.com/derpycode/cgenie.muffin.git
          ls cgenie.muffin/genie-lib/libnc1 | head -3

      - name: 3. 修补 Python2 脚本
        run: |
          sed -i 's/^\(\s*\)print \(.*\)$/\1print(\2)/' cgenie.muffin/genie-main/finc.py
          grep -n "print(" cgenie.muffin/genie-main/finc.py | head -3 || true

      - name: 4. 编译（36x36 网格 + 正确 netCDF 库名）
        run: |
          cd cgenie.muffin/genie-main
          make clean > /dev/null 2>&1 || true
          make GENIE_ROOT="$GITHUB_WORKSPACE/cgenie.muffin" \
               GENIE_FFLAGS="-DGENIENX=36 -DGENIENY=36 -DGENIENL=1" \
               NETCDF_DIR=/usr NETCDF_NAME=netcdf NETCDF_NAMEF=netcdff \
               2>&1 | tail -40
          ls -lh genie.exe

      - name: 5. 检查古地理数据
        run: |
          ls cgenie.muffin/genie-paleo | grep -E "^(300|320|340|360)" || true

      - name: 6. 上传 genie.exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genie-exe
          path: cgenie.muffin/genie-main/genie.exe
          if-no-files-found: warn
